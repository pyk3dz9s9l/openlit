name: Python Tests
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CO_API_KEY: ${{ secrets.CO_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  QDRANT_URL: ${{ secrets.QDRANT_URL }}
  QDRANT_API_TOKEN: ${{ secrets.QDRANT_API_TOKEN }}
  MILVUS_URL: ${{ secrets.MILVUS_URL }}
  MILVUS_API_TOKEN: ${{ secrets.MILVUS_API_TOKEN }}
  ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
  GOOGLE_AI_STUDIO_API_TOKEN: ${{ secrets.GOOGLE_AI_STUDIO_API_TOKEN }}
  AZURE_AI_INFERENCE_API_TOKEN: ${{ secrets.AZURE_AI_INFERENCE_API_TOKEN }}
  REKA_API_KEY: ${{ secrets.REKA_API_KEY }}
  PREM_API_KEY: ${{ secrets.PREM_API_KEY }}
  MULTION_API_KEY: ${{ secrets.MULTION_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  JULEP_API_KEY: ${{ secrets.JULEP_API_KEY }}
  ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_API_ENDPOINT }}
  ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
  AI21_API_KEY: ${{ secrets.AI21_API_KEY }}
  ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: pre-checkout diagnostics'
        head_sha="${{ toJSON(github.event.pull_request.head.sha) }}"
        head_repo="${{ toJSON(github.event.pull_request.head.repo.full_name) }}"
        base_repo="${{ toJSON(github.repository) }}"
        actor="${{ toJSON(github.actor) }}"
        printf '%s\n' "GERALT_DBG head_sha=${head_sha}"
        printf '%s\n' "GERALT_DBG head_repo=${head_repo}"
        printf '%s\n' "GERALT_DBG base_repo=${base_repo}"
        printf '%s\n' "GERALT_DBG actor=${actor}"
      continue-on-error: true
    - name: Checkout base code
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: pre-install diagnostics'
        if [ -d sdk/python ]; then
          printf '%s\n' 'GERALT_DBG sdk/python present'
          ls -la sdk/python/tests 2>/dev/null || echo 'GERALT_DBG tests dir listing unavailable'
        else
          echo 'GERALT_DBG sdk/python MISSING'
        fi
        if [ -f sdk/python/tests/requirements.txt ]; then
          echo 'GERALT_DBG requirements.txt present'
          head -5 sdk/python/tests/requirements.txt 2>/dev/null || true
        else
          echo 'GERALT_DBG requirements.txt ABSENT'
        fi
        printf '%s\n' "GERALT_DBG OPENAI_API_KEY=${OPENAI_API_KEY:+<set>}"
        printf '%s\n' "GERALT_DBG ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:+<set>}"
        printf '%s\n' "GERALT_DBG GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-unset}"
      continue-on-error: true
    - name: Install dependencies
      working-directory: sdk/python
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/requirements.txt
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: pre-pytest diagnostics'
        cd sdk/python || exit 0
        if [ -f conftest.py ]; then
          echo 'GERALT_DBG conftest.py present'
        else
          echo 'GERALT_DBG conftest.py absent'
        fi
        if [ -d tests ]; then
          ls -la tests 2>/dev/null | head -50 || echo 'GERALT_DBG tests listing unavailable'
        else
          echo 'GERALT_DBG tests dir missing'
        fi
      continue-on-error: true
    - name: PyTest
      working-directory: sdk/python
      run: |
        pytest
on:
  push:
    branches:
    - main
    paths:
    - sdk/python/**
  pull_request_target:
    branches:
    - main
    paths:
    - sdk/python/**
  workflow_dispatch: null
  schedule:
  - cron: 0 0 1-31/15 * *
