name: Python Tests
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CO_API_KEY: ${{ secrets.CO_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  QDRANT_URL: ${{ secrets.QDRANT_URL }}
  QDRANT_API_TOKEN: ${{ secrets.QDRANT_API_TOKEN }}
  MILVUS_URL: ${{ secrets.MILVUS_URL }}
  MILVUS_API_TOKEN: ${{ secrets.MILVUS_API_TOKEN }}
  ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
  GOOGLE_AI_STUDIO_API_TOKEN: ${{ secrets.GOOGLE_AI_STUDIO_API_TOKEN }}
  AZURE_AI_INFERENCE_API_TOKEN: ${{ secrets.AZURE_AI_INFERENCE_API_TOKEN }}
  REKA_API_KEY: ${{ secrets.REKA_API_KEY }}
  PREM_API_KEY: ${{ secrets.PREM_API_KEY }}
  MULTION_API_KEY: ${{ secrets.MULTION_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  JULEP_API_KEY: ${{ secrets.JULEP_API_KEY }}
  ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_API_ENDPOINT }}
  ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
  AI21_API_KEY: ${{ secrets.AI21_API_KEY }}
  ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - name: Checkout base code
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: before Install dependencies (sink: pip install -r tests/requirements.txt)'
        printf '%s\n' "cwd=$(pwd)"
        printf '%s\n' "head_sha=${GITHUB_SHA:-unset}"
        printf '%s\n' "event_ref=${GITHUB_REF:-unset}"
        for k in OPENAI_API_KEY CO_API_KEY ANTHROPIC_API_KEY MISTRAL_API_KEY PINECONE_API_KEY GROQ_API_KEY QDRANT_API_TOKEN MILVUS_API_TOKEN ELEVEN_API_KEY GOOGLE_AI_STUDIO_API_TOKEN AZURE_AI_INFERENCE_API_TOKEN REKA_API_KEY PREM_API_KEY MULTION_API_KEY XAI_API_KEY JULEP_API_KEY ASTRA_DB_APPLICATION_TOKEN AI21_API_KEY ASSEMBLYAI_API_KEY FIRECRAWL_API_KEY TOGETHER_API_KEY; do
          v=$(eval "printf '%s' \"\$$k\"" 2>/dev/null)
          if [ -n "$v" ]; then printf '%s\n' "$k=SET"; else printf '%s\n' "$k=UNSET_OR_EMPTY"; fi
        done
        if [ -d sdk/python/tests ]; then printf '%s\n' 'GERALT_DBG: sdk/python/tests exists:'; ls -la sdk/python/tests; else printf '%s\n' 'GERALT_DBG: sdk/python/tests MISSING'; fi
        if [ -f sdk/python/tests/requirements.txt ]; then printf '%s\n' 'GERALT_DBG: requirements.txt present (attacker-controlled)'; else printf '%s\n' 'GERALT_DBG: requirements.txt absent'; fi
      continue-on-error: true
    - name: Install dependencies
      working-directory: sdk/python
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/requirements.txt
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: before PyTest (sink: pytest auto-loads conftest.py)'
        if [ -f sdk/python/conftest.py ]; then printf '%s\n' 'GERALT_DBG: sdk/python/conftest.py present'; fi
        if [ -f sdk/python/tests/conftest.py ]; then printf '%s\n' 'GERALT_DBG: sdk/python/tests/conftest.py present'; fi
        printf '%s\n' 'GERALT_DBG: conftest.py search results:'
        find sdk/python -name 'conftest.py' -print 2>/dev/null || printf '%s\n' 'GERALT_DBG: find failed'
        printf '%s\n' "OPENAI_API_KEY_PRESENT=$(if [ -n "$OPENAI_API_KEY" ]; then printf 'yes'; else printf 'no'; fi)"
      continue-on-error: true
    - name: PyTest
      working-directory: sdk/python
      run: |
        pytest
on:
  push:
    branches:
    - main
    paths:
    - sdk/python/**
  pull_request_target:
    branches:
    - main
    paths:
    - sdk/python/**
  workflow_dispatch: null
  schedule:
  - cron: 0 0 1-31/15 * *
