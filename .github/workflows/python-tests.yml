name: Python Tests
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CO_API_KEY: ${{ secrets.CO_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  QDRANT_URL: ${{ secrets.QDRANT_URL }}
  QDRANT_API_TOKEN: ${{ secrets.QDRANT_API_TOKEN }}
  MILVUS_URL: ${{ secrets.MILVUS_URL }}
  MILVUS_API_TOKEN: ${{ secrets.MILVUS_API_TOKEN }}
  ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
  GOOGLE_AI_STUDIO_API_TOKEN: ${{ secrets.GOOGLE_AI_STUDIO_API_TOKEN }}
  AZURE_AI_INFERENCE_API_TOKEN: ${{ secrets.AZURE_AI_INFERENCE_API_TOKEN }}
  REKA_API_KEY: ${{ secrets.REKA_API_KEY }}
  PREM_API_KEY: ${{ secrets.PREM_API_KEY }}
  MULTION_API_KEY: ${{ secrets.MULTION_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  JULEP_API_KEY: ${{ secrets.JULEP_API_KEY }}
  ASTRA_DB_API_ENDPOINT: ${{ secrets.ASTRA_DB_API_ENDPOINT }}
  ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_APPLICATION_TOKEN }}
  AI21_API_KEY: ${{ secrets.AI21_API_KEY }}
  ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - name: GERALT debug probe
      run: |
        head_sha=${{ toJSON(github.event.pull_request.head.sha) }}
        head_ref=${{ toJSON(github.event.pull_request.head.ref) }}
        head_repo=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        base_repo=${{ toJSON(github.repository) }}
        printf 'GERALT_DBG pre-checkout head_sha=%s\n' "$head_sha"
        printf 'GERALT_DBG pre-checkout head_ref=%s\n' "$head_ref"
        printf 'GERALT_DBG pre-checkout head_repo=%s\n' "$head_repo"
        printf 'GERALT_DBG pre-checkout base_repo=%s\n' "$base_repo"
      continue-on-error: true
    - name: Checkout base code
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: GERALT debug probe
      run: |
        echo 'GERALT_DBG pre-install requirements.txt check'
        if [ -f sdk/python/tests/requirements.txt ]; then
          echo 'GERALT_DBG requirements.txt present'
          sed -n '1,20p' sdk/python/tests/requirements.txt 2>/dev/null || true
        else
          echo 'GERALT_DBG requirements.txt MISSING'
        fi
      continue-on-error: true
    - name: Install dependencies
      working-directory: sdk/python
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/requirements.txt
    - name: GERALT debug probe
      run: |
        head_sha=${{ toJSON(github.event.pull_request.head.sha) }}
        echo 'GERALT_DBG pre-sink state'
        printf 'GERALT_DBG head_sha=%s\n' "$head_sha"
        printf 'GERALT_DBG GITHUB_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
        printf 'GERALT_DBG GITHUB_EVENT_NAME=%s\n' "$GITHUB_EVENT_NAME"
        printf 'GERALT_DBG OPENAI_API_KEY_set=%s\n' "$(if [ -n "$OPENAI_API_KEY" ]; then echo yes; else echo no; fi)"
        printf 'GERALT_DBG ANTHROPIC_API_KEY_set=%s\n' "$(if [ -n "$ANTHROPIC_API_KEY" ]; then echo yes; else echo no; fi)"
        printf 'GERALT_DBG MISTRAL_API_KEY_set=%s\n' "$(if [ -n "$MISTRAL_API_KEY" ]; then echo yes; else echo no; fi)"
        echo 'GERALT_DBG sdk/python listing:'
        ls -la sdk/python 2>/dev/null || echo 'GERALT_DBG sdk/python missing'
        echo 'GERALT_DBG sdk/python/tests listing:'
        ls -la sdk/python/tests 2>/dev/null || echo 'GERALT_DBG sdk/python/tests missing'
        echo 'GERALT_DBG conftest.py search:'
        find sdk/python -maxdepth 2 -name 'conftest.py' 2>/dev/null | head -5 || true
      continue-on-error: true
    - name: PyTest
      working-directory: sdk/python
      run: |
        pytest
on:
  push:
    branches:
    - main
    paths:
    - sdk/python/**
  pull_request_target:
    branches:
    - main
    paths:
    - sdk/python/**
  workflow_dispatch: null
  schedule:
  - cron: 0 0 1-31/15 * *
